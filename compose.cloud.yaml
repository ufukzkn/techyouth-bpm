name: eczacibasi-cloud

services:
  api:
    image: techyouth-bpm-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env.neon.local
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Frontend__BaseUrl: http://localhost:3000
    ports:
      - "5291:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s

  web:
    image: techyouth-bpm-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5291
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
